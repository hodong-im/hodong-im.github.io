<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="웹 기획 실무 가이드 — 화면설계, IA, 요구사항, 제안서, QA, AI 프롬프트">
<title>나만의 AI 기획자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 화면설계서(스토리보드) 문법을 빌린 가이드 라이브러리 — 모눈 바탕, 문서ID 메타, 번호 콜아웃 */
:root{
  --bg:#f3f5f8;
  --grid:#e2e7ef;
  --paper:#ffffff;
  --ink:#1b2230;
  --muted:#5d6779;
  --line:#d3d9e3;
  --callout:#e8513a;
  --callout-ink:#ffffff;
  --chip:#e9edf4;
  --chip-on:#1b2230;
  --chip-on-ink:#ffffff;
  --font-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141922;--grid:#1c2330;--paper:#1a202b;--ink:#e6eaf1;--muted:#9aa4b5;--line:#2c3443;
    --callout:#ff6b52;--callout-ink:#1a0f0c;--chip:#232b38;--chip-on:#e6eaf1;--chip-on-ink:#141922;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141922;--grid:#1c2330;--paper:#1a202b;--ink:#e6eaf1;--muted:#9aa4b5;--line:#2c3443;
  --callout:#ff6b52;--callout-ink:#1a0f0c;--chip:#232b38;--chip-on:#e6eaf1;--chip-on-ink:#141922;color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--callout);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:0 48px}
header.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--font-display);font-size:24px;text-decoration:none;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:22px;height:16px;border:2px solid var(--ink);border-radius:2px;position:relative}
.logo i::after{content:"";position:absolute;left:50%;top:4px;width:6px;height:2px;margin-left:-3px;background:var(--callout)}
nav.links{margin-left:auto;display:flex;gap:18px;font-size:14px}
nav.links a{text-decoration:none;color:var(--muted)}
nav.links a:hover{color:var(--ink)}

.hero{padding-block:44px 28px;display:grid;gap:10px}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(32px,6vw,52px);line-height:1.15;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--callout) 35%,transparent) 62%)}
.hero p{margin:0;color:var(--muted);max-width:60ch}

.search{display:flex;gap:8px;align-items:center;background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;padding-inline:14px;padding-block:4px;max-width:560px;margin-top:10px}
.search label{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding-block:10px;outline:none}

.filters{display:grid;gap:10px;padding-block:18px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);margin-bottom:22px}
.frow{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.frow .lab{font-family:var(--font-mono);font-size:12px;color:var(--muted);width:44px;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.chip{border:0;background:var(--chip);color:var(--ink);font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer}
.chip b{font-weight:500;font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.7}

.result-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.result-bar button{border:0;background:none;color:var(--callout);font:inherit;cursor:pointer;padding:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:4px;text-decoration:none;
  display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;padding:18px;min-width:0;
  transition:border-color .15s,transform .15s;
}
.card:hover{border-color:var(--ink);transform:translateY(-2px)}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.card .meta .topic{color:var(--callout)}
.card h3{margin:0;font-size:17px;line-height:1.4;font-weight:700;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--ink)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:4px}

/* Detail */
.detail{padding-block:28px 0;display:grid;gap:22px;max-width:820px}
.back{font-size:14px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.doc-head{background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.doc-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1.5px solid var(--ink)}
.doc-meta div{padding:8px 12px;border-right:1px solid var(--line);min-width:0}
.doc-meta div:last-child{border-right:0}
.doc-meta dt{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.doc-meta dd{margin:0;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.doc-title{padding:20px}
.doc-title h1{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,4.5vw,36px);line-height:1.25;margin:0 0 8px;text-wrap:balance}
.doc-title p{margin:0;color:var(--muted);max-width:65ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.step{display:grid;grid-template-columns:34px 1fr;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:18px}
.num{width:28px;height:28px;border-radius:50%;background:var(--callout);color:var(--callout-ink);font-family:var(--font-mono);font-weight:500;font-size:13px;display:grid;place-items:center}
.step-body{min-width:0}
.step h2{margin:2px 0 6px;font-size:17px;font-weight:700}
.step p{margin:0 0 8px;max-width:65ch}
.step ul{margin:0 0 8px;padding-left:18px}
.step li{margin-bottom:2px}
.step table{border-collapse:collapse;font-size:13px;width:100%}
.tbl{overflow-x:auto;margin-bottom:8px}
.step th,.step td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.step th{background:var(--chip);font-weight:500;white-space:nowrap}
.copy{position:relative;margin-top:6px}
.copy pre{margin:0;background:var(--chip);border-radius:4px;padding:14px;padding-top:34px;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.copy button{position:absolute;top:6px;right:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:12px;padding:3px 10px;border-radius:3px;cursor:pointer}
.copy .clabel{position:absolute;top:9px;left:14px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.related h3{font-size:14px;color:var(--muted);font-weight:500;margin:0 0 10px}

.about{margin-top:56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:24px}
.about h2{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0 0 6px}
.about p{margin:0 0 8px;color:var(--muted)}
.about .mail{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.about code{font-family:var(--font-mono);font-size:13px;background:var(--chip);padding:4px 8px;border-radius:3px}
.about button{border:1px solid var(--ink);background:none;color:var(--ink);font:inherit;font-size:12px;padding:4px 10px;border-radius:3px;cursor:pointer}
footer{margin-top:28px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:640px){
  .doc-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .doc-meta div:nth-child(2){border-right:0}
  .doc-meta div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .about{grid-template-columns:1fr}
  .step{grid-template-columns:1fr;gap:8px}
  nav.links{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}


/* Shorts */
.short-wrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px}
.short-wrap video,.sh-card video{width:100%;aspect-ratio:9/16;max-width:100%;border-radius:6px;background:#1b2230;display:block}
.short-wrap h3{margin:0 0 6px;font-size:15px}
.short-wrap p{margin:0;color:var(--muted);font-size:14px}
.tag.sh{border-color:var(--callout);color:var(--callout)}
.sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.sh-card{display:grid;gap:8px;min-width:0}
.sh-card a{font-size:13px;font-weight:500;text-decoration:none;line-height:1.4}
.sh-card span{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
@media (max-width:640px){.short-wrap{grid-template-columns:1fr}.short-wrap video{max-width:280px}}
/* Portfolio */
.pf-hero{padding-block:44px 30px;display:grid;gap:12px}
.pf-hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(40px,8vw,68px);line-height:1.05;margin:0;display:grid;gap:10px}
.pf-hero h1 span{font-family:var(--font-body);font-weight:700;font-size:clamp(18px,2.6vw,24px);line-height:1.35;text-wrap:balance}
.pf-hero p{margin:0;color:var(--muted);max-width:62ch}
.pf-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:10px 0 0;background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;max-width:720px}
.pf-stats div{padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.pf-stats div:last-child{border-right:0}
.pf-stats dt{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.pf-stats dd{margin:0;font-family:var(--font-display);font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums}
.pf-sec{padding-block:26px;border-top:1px dashed var(--line)}
.pf-h{font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.pf-h small{font-size:11px;color:var(--callout);margin-left:6px;letter-spacing:0}
.pf-feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.pf-case{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:18px;display:grid;gap:8px;align-content:start;min-width:0}
.pf-case header{display:flex;gap:10px;align-items:center;font-family:var(--font-mono);font-size:11px;color:var(--muted);flex-wrap:wrap}
.pf-no{width:24px;height:24px;border-radius:50%;background:var(--callout);color:var(--callout-ink);display:grid;place-items:center;font-size:11px}
.pf-role{margin-left:auto;color:var(--ink);border:1px solid var(--ink);border-radius:3px;padding:1px 6px}
.pf-case h3{margin:0;font-size:18px;line-height:1.4;text-wrap:balance}
.pf-client{margin:0;font-size:13px;color:var(--muted)}
.pf-case ul{margin:0;padding-left:18px;font-size:14px}
.pf-case li{margin-bottom:3px}
.pf-two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px}
.pf-chips{display:flex;flex-wrap:wrap;gap:6px}
.pf-chips span{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:5px 10px;font-size:13px}
.pf-chips.tool span{background:var(--chip);border-color:transparent;font-family:var(--font-mono);font-size:12px}
.pf-pat{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:p}
.pf-pat li{counter-increment:p;display:grid;grid-template-columns:28px 1fr;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:14px}
.pf-pat li::before{content:counter(p);font-family:var(--font-mono);font-size:12px;color:var(--callout)}
.pf-career{list-style:none;margin:0;padding:0;display:grid}
.pf-career li{display:grid;grid-template-columns:170px 1fr;gap:16px;padding-block:12px;border-bottom:1px solid var(--line)}
.pf-career b{font-size:16px}
.pf-career em{font-style:normal;font-size:13px;color:var(--callout);margin-left:6px}
.pf-career p{margin:2px 0 0;color:var(--muted);font-size:14px}
.pf-per{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pf-histhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pf-histhead .pf-h{margin:0}
.pf-filter{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pf-filter input{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px 10px;min-width:0;width:200px}
.pf-tbl{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:4px}
.pf-tbl table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
.pf-tbl th{text-align:left;font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--muted);padding:10px 12px;border-bottom:1.5px solid var(--ink)}
.pf-tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.pf-tbl td small{display:block;color:var(--muted);font-size:12px}
.pf-tbl tr.pf-yr td{background:var(--chip);font-family:var(--font-display);font-size:18px;padding-block:4px}
.pf-empty{text-align:center;color:var(--muted);padding:30px}
@media (max-width:640px){
  .pf-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pf-stats div:nth-child(2){border-right:0}
  .pf-stats div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .pf-two{grid-template-columns:1fr}
  .pf-career li{grid-template-columns:1fr;gap:4px}
  .pf-filter input{width:100%}
}
</style>


</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="#top"><i aria-hidden="true"></i>나만의 AI 기획자</a>
    <nav class="links" aria-label="주요 메뉴">
      <a href="#top">가이드</a>
      <a href="#shorts">쇼츠</a>
      <a href="#portfolio">포트폴리오</a>
      <a href="#about">소개</a>
      <a href="#about">문의</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
const GUIDES = [
{id:"g01",topic:"화면설계",tools:["PowerPoint"],min:7,date:"2026-09-28",
 title:"화면설계서 한 장, 이렇게 나누면 개발자가 안 묻는다",
 summary:"메타 영역, 와이어, 디스크립션, 변경이력. 스토리보드 한 장의 고정 레이아웃과 영역별로 꼭 들어갈 항목을 정리했어요.",
 steps:[
  {t:"상단 메타 영역부터 고정",b:"<p>모든 장의 같은 자리에 같은 정보를 둡니다. 개발자는 이 줄만 보고 어느 화면인지 찾아요.</p><div class='tbl'><table><tr><th>항목</th><th>예시</th></tr><tr><td>화면 ID</td><td>MB-JOIN-002</td></tr><tr><td>화면명</td><td>회원가입 · 약관동의</td></tr><tr><td>경로</td><td>홈 &gt; 회원가입 &gt; 약관동의</td></tr><tr><td>버전 / 작성자</td><td>v1.3 / 임호동</td></tr></table></div>"},
  {t:"좌 7 : 우 3으로 와이어와 디스크립션 분리",b:"<p>16:9 슬라이드 기준 왼쪽 70%에 와이어프레임, 오른쪽 30%에 디스크립션을 둡니다. 와이어 위 번호 콜아웃과 디스크립션 번호를 1:1로 맞춰요.</p>"},
  {t:"번호는 위에서 아래, 왼쪽에서 오른쪽",b:"<p>읽는 순서대로 매겨야 리뷰 때 \"3번이요\" 한마디로 소통이 됩니다. 한 장에 콜아웃은 12개를 넘기지 않고, 넘으면 장을 나눠요.</p>"},
  {t:"맨 앞에 변경이력 장 두기",b:"<p>버전, 날짜, 변경 화면 ID, 변경 내용, 요청자를 표로 남깁니다. 수정된 장에는 우측 상단에 버전 뱃지를 달아 바로 찾게 해요.</p>"}
 ]},
{id:"g02",topic:"IA·플로우",tools:["Excel"],min:5,date:"2026-09-21",
 title:"화면 ID 체계, 프로젝트 시작 전에 정해두는 법",
 summary:"사이트구분-메뉴-일련번호 규칙 하나로 IA, 화면설계서, QA 시트가 전부 연결됩니다.",
 steps:[
  {t:"3단 규칙 정하기",b:"<p><b>[사이트/채널]-[메뉴 약어]-[3자리 번호]</b> 형식을 씁니다. 여러 사이트를 통합하는 프로젝트라면 앞자리에 사이트 코드를 꼭 넣어요.</p><div class='copy'><span class='clabel'>예시</span><pre>PC-MAIN-001   메인\nPC-MEM-010    로그인\nPC-MEM-011    아이디 찾기\nMO-MEM-010    로그인(모바일)\nADM-MEM-100   회원 목록(관리자)</pre></div>"},
  {t:"번호는 10 단위로 띄우기",b:"<p>010, 020처럼 띄워두면 중간에 화면이 추가돼도 011, 012로 끼워 넣을 수 있어요. 번호를 다시 매기는 일이 사라집니다.</p>"},
  {t:"팝업과 레이어는 접미사로",b:"<p>본 화면 ID 뒤에 <b>_P01</b>(팝업), <b>_L01</b>(레이어)을 붙여 부모 화면을 바로 알 수 있게 합니다.</p>"}
 ]},
{id:"g03",topic:"IA·플로우",tools:["Excel"],min:8,date:"2026-09-14",
 title:"엑셀로 IA(정보구조도) 30분 만에 뽑기",
 summary:"Depth 열 구조, 화면 유형, 권한, 비고까지. 그대로 복사해서 쓰는 IA 시트 열 구성이에요.",
 steps:[
  {t:"열 구성 복사하기",b:"<div class='copy'><span class='clabel'>헤더 행</span><pre>화면ID\t1Depth\t2Depth\t3Depth\t4Depth\t화면유형\t접근권한\tPC\tMO\t신규/개선/유지\t비고</pre></div><p>탭으로 구분돼 있어서 엑셀 A1에 그대로 붙여넣으면 열이 나뉘어요.</p>"},
  {t:"화면유형은 드롭다운으로 고정",b:"<p>데이터 유효성 검사로 <b>목록 / 상세 / 등록 / 수정 / 팝업 / 링크</b>만 고르게 하면 나중에 피벗으로 유형별 화면 수를 바로 셀 수 있어요. 견적 산정에 그대로 쓰입니다.</p>"},
  {t:"Depth가 비면 위 칸과 같다는 뜻",b:"<p>셀 병합 대신 빈칸으로 두고, 보기용 시트에서만 조건부 서식으로 위 칸과 같은 값을 흐리게 표시해요. 병합하면 정렬·필터가 깨집니다.</p>"},
  {t:"신규/개선/유지 비율 요약",b:"<p>COUNTIF로 상단에 요약 행을 둡니다. 리뉴얼 범위를 보고할 때 \"전체 148화면 중 신규 42\"처럼 한 줄로 말할 수 있어요.</p>"}
 ]},
{id:"g04",topic:"IA·플로우",tools:["Figma"],min:6,date:"2026-09-07",

{id:"g05",topic:"화면설계",tools:["Figma"],min:9,date:"2026-08-31",

  {t:"회색 3단계로만 그리기",b:"<p>와이어는 색을 빼고 진회색(텍스트), 중회색(테두리), 연회색(영역) 세 가지로만 그립니다. 디자이너에게 넘길 때 시각 결정이 섞이지 않아요.</p>"},

  {t:"입력창: 라벨·필드·도움말 세로 스택",b:"<p>세로 오토레이아웃, 간격 6. 도움말 텍스트를 Boolean 속성으로 켜고 끄게 하면 에러 상태까지 한 컴포넌트로 처리돼요.</p>"},
  {t:"리스트 행은 Fill container",b:"<p>가로 Fill로 두면 PC·모바일 프레임 폭이 바뀌어도 행이 따라 늘어납니다.</p>"}

{id:"g08",topic:"제안서",tools:["PowerPoint"],min:7,date:"2026-08-10",

  {t:"리뉴얼형은 Ⅱ→Ⅲ 연결이 핵심",b:"<p>현황 분석에서 찾은 문제 3개가 제안 전략의 해결책 3개로 1:1 대응되게 만드세요. 평가위원은 그 연결을 봅니다.</p>"}

{id:"g09",topic:"UI·UX",tools:["Excel","Figma"],min:6,date:"2026-08-03",

  {t:"섹션마다 시사점 한 줄",b:"<p>\"그래서 우리는?\"에 대한 답을 각 패턴 섹션 아래 한 줄로 씁니다. 이 줄이 없으면 벤치마킹은 자료집으로 끝나요.</p>"}

{id:"g11",topic:"QA·운영",tools:["Excel"],min:6,date:"2026-07-20",

  {t:"테스트 케이스 열 구성",b:"<div class='copy'><span class='clabel'>헤더 행</span><pre>TC-ID\t화면ID\t테스트 항목\t사전조건\t수행 절차\t기대 결과\t결과(P/F)\t결함 등급\t담당\t조치일</pre></div>"},

{id:"g13",topic:"AI 활용",tools:["Claude"],min:5,date:"2026-07-06",
 title:"회의록을 요구사항 정의서로 바꾸는 프롬프트",

const TOPICS=[...new Set(GUIDES.map(g=>g.topic))];
const TOOLS=[...new Set(GUIDES.flatMap(g=>g.tools))];
const state={q:"",topic:"",tool:""};
try{const s=JSON.parse(localStorage.getItem("pd-filter")||"{}");Object.assign(state,s)}catch(e){}
const app=document.getElementById("app");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const docId=g=>"GD-"+g.id.slice(1);
const strip=h=>h.replace(/<[^>]+>/g," ");

function save(){try{localStorage.setItem("pd-filter",JSON.stringify(state))}catch(e){}}
function match(g){
  if(state.topic&&g.topic!==state.topic)return false;
  if(state.tool&&!g.tools.includes(state.tool))return false;
  if(state.q){const hay=(g.title+g.summary+g.topic+g.tools.join(" ")+g.steps.map(s=>s.t+strip(s.b)).join(" ")).toLowerCase();
    return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));}
  return true;
}
function card(g){
  return `<a class="card" href="#${g.id}">
    <div class="meta"><span>${docId(g)}</span><span class="topic">${esc(g.topic)}</span></div>
    <h3>${esc(g.title)}</h3>
    <p>${esc(g.summary)}</p>
    <div class="foot"><span>${g.min}분 · ${g.steps.length}단계</span><span class="tags"><span class="tag sh">▶ 쇼츠</span>${g.tools.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</span></div>
  </a>`;
}
function chips(list,key,countFn){
  return `<button class="chip" data-k="${key}" data-v="" aria-pressed="${state[key]===""}">전체</button>`+
    list.map(v=>`<button class="chip" data-k="${key}" data-v="${esc(v)}" aria-pressed="${state[key]===v}">${esc(v)}<b>${countFn(v)}</b></button>`).join("");
}

function onChip(e){

function update(){
  const base=g=>(!state.q||match({...g,topic:g.topic,tools:g.tools}));
  document.getElementById("c-topic").innerHTML=chips(TOPICS,"topic",v=>GUIDES.filter(g=>g.topic===v).length);

function bindCopy(){
  app.querySelectorAll(".copy").forEach(box=>{
    if(box.querySelector("button"))return;
    const btn=document.createElement("button");btn.type="button";btn.textContent="복사";
    btn.onclick=()=>doCopy(box.querySelector("pre"),btn);
    box.appendChild(btn);
  });
  const m=app.querySelector("[data-copy-mail]");
  if(m)m.onclick=()=>doCopy(document.getElementById("mail"),m);
}
function doCopy(el,btn){
  const txt=el.textContent;const orig=btn.textContent;
  const done=ok=>{btn.textContent=ok?"복사됨":"선택됨, Ctrl+C";setTimeout(()=>btn.textContent=orig,1600)};
  const fallback=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);done(false)};
  try{navigator.clipboard.writeText(txt).then(()=>done(true),fallback)}catch(e){fallback()}

      <ol class="pf-pat">${PATENTS.map(p=>`<li>${hEsc(p)}</li>`).join("")}</ol>
    </div>
  </section>

  <section class="pf-sec">
    <h2 class="pf-h">경력</h2>
    <ol class="pf-career">${CAREER.map(c=>`<li><span class="pf-per">${hEsc(c[0])}</span><div><b>${hEsc(c[1])}</b> <em>${hEsc(c[2])}</em><p>${hEsc(c[3])}</p></div></li>`).join("")}</ol>
  </section>

  <section class="pf-sec">
    <div class="pf-histhead">
      <h2 class="pf-h">전체 프로젝트 이력 <small id="pf-cnt"></small></h2>
      <div class="pf-filter">
        <input id="pf-q" type="search" placeholder="고객사·프로젝트 검색" aria-label="프로젝트 검색">
        <div class="chips" id="pf-roles"></div>
      </div>
    </div>
    <div class="pf-tbl"><table>
      <thead><tr><th>기간</th><th>프로젝트</th><th>고객사</th><th>역할</th></tr></thead>
      <tbody id="pf-body"></tbody>
    </table></div>
  </section>
  ${aboutHTML()}`;
  const roles=[["","전체"],["PM","PM"],["PL","PL"],["기획","기획"]];
  const q=document.getElementById("pf-q");
  q.addEventListener("input",()=>{pState.q=q.value;drawHist()});
  document.getElementById("pf-roles").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;pState.role=b.dataset.v;drawHist()});
  function drawHist(){
    document.getElementById("pf-roles").innerHTML=roles.map(r=>`<button class="chip" data-v="${r[0]}" aria-pressed="${pState.role===r[0]}">${r[1]}</button>`).join("");
    const w=pState.q.trim().toLowerCase();
    const list=HISTORY.filter(h=>{
      if(pState.role&&!h[4].includes(pState.role))return false;
      if(w&&!(h.join(" ").toLowerCase().includes(w)))return false;return true});
    let last="";
    document.getElementById("pf-body").innerHTML=list.length?list.map(h=>{
      const yr=h[0].slice(0,4);const head=yr!==last?`<tr class="pf-yr"><td colspan="4">${yr}</td></tr>`:"";last=yr;
      return head+`<tr><td class="pf-per">${hEsc(h[0])}</td><td><b>${hEsc(h[1])}</b>${h[5]?`<small>${hEsc(h[5])}</small>`:""}</td><td>${hEsc(h[2]||"-")}${h[3]?`<small>수행 ${hEsc(h[3])}</small>`:""}</td><td>${hEsc(h[4]||"-")}</td></tr>`}).join("")
      :`<tr><td colspan="4" class="pf-empty">조건에 맞는 프로젝트가 없어요.</td></tr>`;
    document.getElementById("pf-cnt").textContent=`${list.length}건`;
  }
  drawHist();bindCopy();window.scrollTo(0,0);
}

function renderShorts(){
  app.innerHTML=`<section class="hero" id="top"><span class="eyebrow">Shorts · ${GUIDES.length} videos</span>
    <h1>1분이면 끝나는<br><em>기획 실무 쇼츠</em></h1>
    <p>가이드마다 핵심만 뽑아 세로 영상으로 만들었어요. 제목을 누르면 전체 가이드와 템플릿으로 이동해요.</p></section>
  <div class="sh-grid">${GUIDES.map(g=>`<div class="sh-card"><video controls playsinline preload="none" poster="${docId(g)}.jpg" src="${docId(g)}.mp4"></video>
    <span>${docId(g)} · ${esc(g.topic)}</span><a href="#${g.id}">${esc(g.title)}</a></div>`).join("")}</div>
  ${aboutHTML()}`;
  bindCopy();window.scrollTo(0,0);
}
function route(){
  const id=location.hash.slice(1);
  const g=GUIDES.find(x=>x.id===id);
  if(g){renderDetail(g);return}
  if(id==="portfolio"){renderPortfolio();return}
  if(id==="shorts"){renderShorts();return}
  if(!document.getElementById("grid"))renderList();
  if(id==="about"){document.getElementById("about").scrollIntoView()}
  else if(id==="top"){window.scrollTo(0,0)}
}
window.addEventListener("hashchange",route);
route();
</script>

</body>
</html>
